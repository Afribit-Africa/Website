      - generic [ref=e37]:
        - text: April 10, 2026
        - 'heading "On Kenya’s draft Virtual Asset Service Providers Regulations: Calibration within an existing financial system" [level=1] [ref=e38]'
    - generic [ref=e44]:
      - article [ref=e45]:
        - img "virtual-asset-vasp-bill-illustration" [ref=e47]
        - generic [ref=e49]:
          - paragraph [ref=e50]: We have submitted our comments to Parliament on the Draft Virtual Asset Service Providers Regulations, 2026, made pursuant to the Virtual Asset Service Providers Act 2025. The Draft Regulations represent a significant and necessary step towards the formalization of a legal framework governing virtual asset activity in Kenya. They are clearly directed at introducing licensing standards, establishing prudential and conduct obligations, and aligning the jurisdiction with international anti-money laundering and counter-terrorism financing expectations, particularly those developed by the Financial Action Task Force. In that respect, the regulatory intent is both evident and commendable.
          - paragraph [ref=e51]: The question that arises, however, is not whether regulation is required, but whether the structure of the Draft Regulations reflects the manner in which virtual asset activity actually operates within the Kenyan legal and economic system. There is a discernible reliance within the Draft on regulatory assumptions drawn from more mature jurisdictions, including those reflected in the Markets in Crypto-Assets Regulation. Comparative reference is neither unusual nor inappropriate in financial regulation. Its utility, however, depends on whether the institutional and economic premises underlying those frameworks are equally present in the receiving jurisdiction. In the Kenyan context, that equivalence does not consistently obtain.
          - paragraph [ref=e52]: The Draft Regulations proceed, as many such frameworks do, on the basis that virtual asset services can be organized into discrete and independently regulated categories, including exchange, custody, issuance, transfer and conversion. While this classification is doctrinally coherent, it does not fully capture the operational reality of the Kenyan market. In practice, a single transaction may originate as a payment, be converted into a virtual asset, transmitted across a network, and reconverted into fiat for settlement, all within a continuous transactional sequence. The legal framework, however, encounters this sequence as a series of distinct regulatory events, each potentially attracting its own set of obligations across different legal regimes. The consequence is not merely duplication, but fragmentation, as the law disaggregates what is, in substance, a single economic activity into multiple compliance points.
          - paragraph [ref=e53]: This fragmentation becomes particularly evident at the point of licensing. Regulation 5 requires applicants to disclose, in detail, their business model, governance arrangements, operational systems, and financial position. This is, in principle, entirely appropriate. The difficulty arises from the assumption that such disclosure can be assessed within a single regulatory silo. In reality, once a business model is fully articulated, it often engages multiple areas of law simultaneously, including payment systems regulation, anti-money laundering obligations, and, in certain instances, capital markets oversight. The Draft Regulations do not currently provide a clear mechanism through which these overlapping legal considerations are reconciled at the point of entry. As a result, licensing ceases to be a straightforward question of compliance and becomes instead an exercise in navigating concurrent and, at times, uncoordinated regulatory expectations.
          - paragraph [ref=e54]: A related concern arises in relation to the treatment of conversion under Regulation 12. The requirement for separate authorization to undertake conversion between fiat and virtual assets reflects an attempt to align digital asset activity with traditional foreign exchange frameworks. However, in practical terms, conversion is seldom an isolated activity. It is typically embedded within a broader transactional process. By isolating conversion as a distinct licensing event, the Regulations introduce an additional layer of authorization into what is otherwise a continuous transaction. These risks creating regulatory duplication without a corresponding increase in oversight effectiveness, and further contributes to the fragmentation already noted.
          - paragraph [ref=e55]: The prudential framework set out in Regulation 82 and the Fifth Schedule presents a similar issue of calibration. The imposition of paid-up and liquid capital requirements is grounded in a well-established regulatory logic, namely that capital serves as a buffer against risk and a mechanism for ensuring market discipline. That logic is entirely appropriate within institutional financial systems where entities intermediate significant pools of value and may pose systemic risk. The Kenyan virtual asset market, however, is not yet characterized by such institutional dominance. It remains largely retail-driven, with relatively low transaction values and risk profiles that are more closely associated with custody, operational resilience, and governance than with balance sheet scale. In this context, fixed capital thresholds, particularly where applied cumulatively across multiple licensed activities, risk operating as barriers to entry rather than proportionate safeguards. The more appropriate inquiry is whether capital requirements are linked to actual exposure, including transaction volumes, custody arrangements, and operational complexity, rather than imposed as uniform benchmarks.
          - paragraph [ref=e56]: The reporting and transaction monitoring obligations under Regulations 21 and 25 further illustrate the need for proportionality. The requirement for detailed transaction data capture and near-continuous reporting reflects international standards on traceability and oversight. However, in a market characterized by high-frequency, low-value transactions, such obligations may impose significant compliance burdens, particularly on smaller operators, without necessarily enhancing the quality of regulatory insight. There is also a risk that disproportionate reporting requirements may have the unintended effect of displacing activity beyond the formal regulatory perimeter, thereby reducing, rather than improving, visibility. A more calibrated approach would align reporting intensity with the level of risk presented by the activity in question.
          - paragraph [ref=e57]: The ownership restrictions contained in Regulation 28 similarly warrant reconsideration. While the objective of preventing undue concentration and ensuring transparency of control is legitimate, the imposition of a fixed ownership cap does not sit easily with the realities of early-stage and growth-stage enterprises, particularly in technology-driven sectors. Concentrated ownership is often a feature of such enterprises, at least in their formative stages. A rigid cap may therefore discourage investment, distort capital structures, and incentivize the use of offshore vehicles to achieve outcomes that could otherwise be accommodated within a domestic framework. A more proportionate approach would rely on enhanced disclosure, fit-and-proper assessments, and regulatory approval mechanisms for significant shareholding, rather than fixed numerical limits.
          - paragraph [ref=e58]: The provisions relating to stablecoins adopt a reserve-based model that is broadly consistent with international practice. The requirement for full backing and asset segregation is, in principle, appropriate, particularly in a retail-facing market. However, the framework would benefit from greater clarity and flexibility in relation to reserve composition. An overly restrictive approach to permissible reserve assets may limit liquidity and reduce the practical utility of stablecoins, particularly in cross-border settlement and remittance contexts. The regulatory objective should be to ensure the integrity of the peg and the protection of holders, while allowing sufficient operational flexibility to support legitimate use cases.
          - paragraph [ref=e59]: All of these considerations must be understood against the background of Kenya’s existing financial architecture. The country’s financial system has developed along a trajectory that is distinct from that of many of the jurisdictions from which comparative frameworks are drawn. It is mobile-first, retail-oriented, and characterized by the integration of financial services into everyday transactional activity. The success of M-Pesa is not merely illustrative; it is indicative of a system in which value transfer is embedded within the fabric of daily economic life. Regulation in such a system must be responsive to the manner in which transactions actually occur, rather than to an abstracted institutional model.
          - paragraph [ref=e60]: None of this suggests that Kenya should depart from international standards. Compliance with FATF principles remains essential. Those principles, however, are deliberately framed in a manner that allows for domestic calibration. They require effective identification and mitigation of risk; they do not prescribe a uniform institutional architecture. The task, therefore, is not to replicate external frameworks, but to adapt them in a manner that is coherent within the Kenyan context.
          - paragraph [ref=e61]: The Draft Regulations provide a strong foundation upon which such a framework may be built. The refinements required are not fundamental departures, but adjustments of calibration. If those adjustments are made, Kenya will have a regime that is not only compliant, but also functional and capable of supporting the development of a domestic digital asset market. If they are not, there is a risk that activity will continue, but that the value associated with that activity, including capital formation and strategic control, will be located elsewhere.
          - paragraph [ref=e62]: The distinction between those two outcomes lies not in the presence or absence of regulation, but in its design.
